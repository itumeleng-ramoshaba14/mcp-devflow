# =====================================
# Atlassian MCP
# =====================================

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=30s


# =====================================
# Atlassian MCP Connection
# =====================================

spring.ai.mcp.client.streamable-http.connections.atlassian.url=https://mcp.atlassian.com
spring.ai.mcp.client.streamable-http.connections.atlassian.endpoint=/v2/mcp


# =====================================
# OAuth / Dynamic Client Registration
# =====================================

spring.ai.mcp.client.authorization.dynamic-client-registration.enabled=true


# =====================================
# DevFlow Atlassian Configuration
# =====================================

devflow.atlassian.cloud-id=${DEVFLOW_ATLASSIAN_CLOUD_ID:}